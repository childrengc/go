<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>출발! 성경 탐험대! - 3D 복셀 어드벤처</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      font-family: 'Noto Sans KR', sans-serif; background: #0f172a;
    }
    .font-jua { font-family: 'Jua', sans-serif; }
    .mc-panel {
      background: rgba(15, 23, 42, 0.88);
      border: 3px solid #f59e0b;
      box-shadow: 0 6px 0 #78350f, 0 10px 20px rgba(0,0,0,0.45);
    }
    .mc-card {
      background: #fffbeb;
      border: 4px solid #b45309;
      box-shadow: 0 8px 0 #78350f, 0 14px 28px rgba(0,0,0,0.5);
    }
    .mc-btn {
      border: 2px solid rgba(0,0,0,0.35);
      box-shadow: 0 4px 0 rgba(0,0,0,0.45);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }
    .mc-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(0,0,0,0.45);
    }
    .world-label {
      position: absolute; transform: translate(-50%, -100%);
      pointer-events: none; transition: opacity 0.15s ease; z-index: 15;
    }
    @keyframes popScale {
      0% { transform: scale(0.4); opacity: 0; }
      60% { transform: scale(1.18); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .count-anim { animation: popScale 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

    @keyframes floatPin {
      0%, 100% { transform: translate(-50%, -50%) translateY(0px); }
      50% { transform: translate(-50%, -50%) translateY(-4px); }
    }
    .map-pin-node {
      position: absolute;
      transform: translate(-50%, -50%);
      animation: floatPin 2.8s ease-in-out infinite;
    }
    .map-pin-node:hover { z-index: 30; }

    @keyframes dashFlow {
      to { stroke-dashoffset: -32; }
    }
    .map-route-line {
      stroke-dasharray: 10 6;
      animation: dashFlow 1.5s linear infinite;
    }

    .modal-scroll {
      max-height: 92dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* 휴대폰 가로모드(높이 540px 이하) 최적화 */
    @media (max-height: 540px) and (orientation: landscape) {
      .landscape-modal-card {
        max-width: 44rem !important;
        padding: 0.75rem 1rem !important;
        max-height: 94dvh !important;
      }
      .landscape-split {
        display: grid;
        grid-template-columns: 1fr 1.15fr;
        gap: 0.75rem;
        align-items: center;
      }
      .landscape-compact-title { font-size: 1.15rem !important; margin-bottom: 0.2rem !important; }
      .landscape-compact-icon { font-size: 1.75rem !important; margin-bottom: 0.15rem !important; }
      .landscape-compact-verse { padding: 0.5rem !important; margin-bottom: 0 !important; font-size: 0.75rem !important; }
      .landscape-map-wrap { height: 74dvh !important; }
      .map-pin-card { padding: 0.25rem 0.45rem !important; min-width: 108px !important; }
    }
  </style>
</head>
<body class="relative w-full h-full select-none">

  <!-- 3D 캔버스 & 월드 라벨 -->
  <div id="canvas-container" class="absolute inset-0 z-0"></div>
  <div id="labels-container" class="absolute inset-0 pointer-events-none overflow-hidden z-10"></div>

  <!-- 피격 시 붉은 플래시 / 페이드 연출 -->
  <div id="damage-flash" class="fixed inset-0 bg-red-600 pointer-events-none opacity-0 transition-opacity duration-300 z-30"></div>
  <div id="white-fade" class="fixed inset-0 bg-white pointer-events-none opacity-0 transition-opacity duration-500 z-40"></div>
  <div id="black-fade" class="fixed inset-0 bg-slate-950 pointer-events-none opacity-0 transition-opacity duration-500 z-40 flex flex-col items-center justify-center text-center px-6">
    <div id="black-fade-icon" class="text-6xl mb-4">🌧️</div>
    <p id="black-fade-title" class="font-jua text-2xl sm:text-3xl text-amber-300 mb-2"></p>
    <p id="black-fade-sub" class="text-sm sm:text-base text-slate-300"></p>
  </div>

  <!-- 스테이지 2 출발 카운트다운 오버레이 -->
  <div id="stage2-countdown-overlay" style="display:none;" class="fixed inset-0 bg-slate-950/60 backdrop-blur-[2px] z-35 flex flex-col items-center justify-center pointer-events-none">
    <p class="font-jua text-amber-300 text-xl sm:text-2xl mb-2 drop-shadow">⚡ 애굽 병사 추격전 준비!</p>
    <div id="stage2-countdown-num" class="font-jua text-7xl sm:text-8xl text-white drop-shadow-[0_6px_0_#b45309] count-anim">3</div>
  </div>

  <!-- 토스트 알림 -->
  <div id="toast-box" class="fixed top-20 left-1/2 -translate-x-1/2 z-40 pointer-events-none opacity-0 transition-opacity duration-300 w-[90%] max-w-md">
    <div class="mc-panel px-4 py-2.5 rounded-2xl text-center">
      <span id="toast-text" class="font-jua text-amber-200 text-xs sm:text-sm"></span>
    </div>
  </div>

  <!-- 상단 HUD -->
  <div id="hud-top" class="hidden fixed top-2 left-2 right-2 z-20 flex flex-col gap-1.5 pointer-events-none">
    <div class="flex items-center justify-between gap-1.5">
      <div class="mc-panel px-2.5 py-1 rounded-xl flex items-center gap-1.5 pointer-events-auto">
        <span id="hud-avatar-icon" class="text-lg">🧔🏻</span>
        <span id="hud-player-tag" class="font-jua text-white text-xs sm:text-sm">대원</span>
        <span class="text-amber-400">·</span>
        <span id="hud-stage-badge" class="font-jua text-amber-300 text-xs sm:text-sm">스테이지 1</span>
      </div>

      <div class="flex items-center gap-1.5 pointer-events-auto">
        <div id="hud-block-box" class="hidden mc-panel px-2.5 py-1 rounded-xl items-center gap-1 bg-amber-950/90">
          <span class="text-sm">🪵</span>
          <span id="hud-block-text" class="font-jua text-amber-200 text-xs">통나무 0/2개</span>
        </div>

        <div id="hud-timer-box" class="hidden mc-panel px-2.5 py-1 rounded-xl items-center gap-1 bg-rose-950/90 border-rose-400">
          <span class="text-sm">⏰</span>
          <span id="hud-timer-val" class="font-jua text-rose-200 text-xs sm:text-sm">10.0초</span>
        </div>

        <div class="mc-panel px-2.5 py-1 rounded-xl flex items-center gap-1">
          <span id="hud-counter-icon" class="text-sm">🐾</span>
          <span id="hud-counter-text" class="font-jua text-emerald-300 text-xs sm:text-sm">0/7쌍</span>
        </div>

        <button id="hud-mode-btn" type="button" onclick="openScreen('screen-map')" class="mc-btn px-2.5 py-1 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-jua text-xs">
          🗺️맵
        </button>
        <button id="bgm-btn" type="button" onclick="toggleBgm()" class="mc-btn w-8 h-8 rounded-xl bg-slate-800 text-white text-sm flex items-center justify-center">
          🎵
        </button>
      </div>
    </div>

    <div id="hud-mission-box" onclick="speakCurrentMission()" class="mc-panel px-3 py-1.5 rounded-xl self-center max-w-xl w-full text-center pointer-events-auto cursor-pointer">
      <p class="text-amber-100 font-jua text-xs sm:text-sm truncate">
        🔊 <span id="hud-mission-text">미션 안내</span>
      </p>
      <p id="hud-compass-hint" class="text-[10px] text-amber-300/90">💛 캐릭터 머리 위 노란 화살표를 따라가 보세요! (터치 시 음성 안내)</p>
    </div>
  </div>

  <!-- 좌측 하단 가상 조이스틱 -->
  <div id="joystick-zone" style="display:none;" class="fixed bottom-5 left-5 w-28 h-28 rounded-full bg-slate-900/55 border-2 border-amber-400/70 z-20 touch-none">
    <div id="joystick-knob" class="w-12 h-12 rounded-full bg-amber-400/90 border-2 border-white shadow-lg absolute top-1/2 left-1/2 -mt-6 -ml-6 pointer-events-none"></div>
  </div>

  <!-- 하단 중앙 시점 회전 바 -->
  <div id="cam-bottom-bar" style="display:none;" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-20 items-center gap-2">
    <button type="button" onclick="rotateCameraDeg(-25)" class="mc-btn px-3 py-1.5 rounded-xl bg-slate-800/90 text-amber-200 font-jua text-xs">↺ 시점 좌회전</button>
    <button type="button" onclick="rotateCameraDeg(25)" class="mc-btn px-3 py-1.5 rounded-xl bg-slate-800/90 text-amber-200 font-jua text-xs">시점 우회전 ↻</button>
  </div>

  <!-- 우측 하단 액션 & 점프 버튼 -->
  <div id="action-zone" style="display:none;" class="fixed bottom-5 right-5 z-20 flex flex-col items-end gap-2">
    <button id="cert-open-btn" type="button" onclick="showEndingCertificate()" class="hidden mc-btn px-4 py-2 rounded-2xl bg-amber-400 text-slate-950 font-jua text-sm animate-bounce">
      🏆 인증서 보기
    </button>
    <button id="puzzle-build-btn" type="button" onclick="triggerPuzzleBuildOrSwitch()" class="hidden mc-btn px-4 py-2 rounded-2xl bg-sky-400 text-slate-950 font-jua text-xs sm:text-sm animate-pulse">
      🔨 다리 통나무 놓기!
    </button>
    <button id="context-action-btn" type="button" onclick="triggerContextAction()" class="hidden mc-btn px-4 py-2.5 rounded-2xl bg-emerald-400 text-slate-950 font-jua text-sm animate-bounce">
      ✨ 액션 실행!
    </button>
    <button type="button" onclick="playerJump()" class="mc-btn w-20 h-20 rounded-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-jua text-base flex flex-col items-center justify-center">
      <span class="text-xl leading-none">🦘</span>
      <span>점프</span>
    </button>
  </div>

  <!-- =================================================================== -->
  <!-- 화면 1: 오프닝 화면 (우측 상단 관리자 자물쇠 포함) -->
  <!-- =================================================================== -->
  <div id="screen-opening" class="fixed inset-0 z-30 flex items-center justify-center p-3 bg-slate-950/45 backdrop-blur-[2px]">
    <div class="mc-card modal-scroll relative w-full max-w-md rounded-3xl p-5 sm:p-6 text-center">
      <!-- 관리자 모드 진입 자물쇠 버튼 -->
      <a href="admin.html" title="관리자 모드" class="mc-btn absolute top-3.5 right-3.5 w-8 h-8 rounded-xl bg-amber-100 hover:bg-amber-200 border border-amber-400 flex items-center justify-center text-sm opacity-75 hover:opacity-100">
        🔒
      </a>

      <div class="inline-block px-3 py-1 rounded-full bg-amber-200 text-amber-900 font-jua text-xs mb-2">
        ✨ 3D 바이블 어드벤처
      </div>
      <h1 class="font-jua text-3xl sm:text-4xl text-amber-900 mb-1">출발! 성경 탐험대!</h1>
      <p class="text-xs sm:text-sm text-slate-600 mb-4">말씀 속 주인공이 되어 믿음의 모험을 떠나요!</p>

      <div class="bg-amber-100/80 border-2 border-amber-400 rounded-2xl p-3.5 mb-4 text-left">
        <label for="opening-name-input" class="block font-jua text-amber-900 text-sm mb-1.5">🎖️ 탐험 대원 이름을 입력해 주세요</label>
        <input id="opening-name-input" type="text" maxlength="10" placeholder="예: 김다윗" class="w-full px-3.5 py-2.5 rounded-xl border-2 border-amber-500 bg-white font-bold text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400" />
      </div>

      <button type="button" onclick="goToClassSelect()" class="mc-btn w-full py-3 rounded-2xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-jua text-lg">
        🚀 탐험 출발하기!
      </button>
    </div>
  </div>

  <!-- =================================================================== -->
  <!-- 화면 2: 반(난이도) 선택 화면 (우측 상단 관리자 자물쇠 포함) -->
  <!-- =================================================================== -->
  <div id="screen-class" class="hidden fixed inset-0 z-30 items-center justify-center p-3 bg-slate-950/55 backdrop-blur-[2px]">
    <div class="mc-card modal-scroll relative w-full max-w-lg rounded-3xl p-4 sm:p-6 text-center">
      <!-- 관리자 모드 진입 자물쇠 버튼 -->
      <a href="admin.html" title="관리자 모드" class="mc-btn absolute top-3.5 right-3.5 w-8 h-8 rounded-xl bg-amber-100 hover:bg-amber-200 border border-amber-400 flex items-center justify-center text-sm opacity-75 hover:opacity-100">
        🔒
      </a>

      <p id="class-hello-name" class="font-jua text-xl sm:text-2xl text-amber-900 mb-1 pr-6">🙌 대원님, 환영해요!</p>
      <p class="text-xs text-slate-600 mb-3">나에게 맞는 부서(난이도)를 선택해 주세요!</p>

      <div class="grid grid-cols-2 gap-2.5 mb-3 text-left">
        <button type="button" onclick="selectClassAndShowMap('kinder')" class="mc-btn p-3 rounded-2xl bg-yellow-100 hover:bg-yellow-200 border-amber-400">
          <div class="font-jua text-base text-amber-900">🐣 유치반</div>
          <p class="text-[11px] text-slate-600 mt-0.5">미취학 · 쉬운 길 안내 & 퀴즈 면제</p>
        </button>
        <button type="button" onclick="selectClassAndShowMap('junior')" class="mc-btn p-3 rounded-2xl bg-emerald-100 hover:bg-emerald-200 border-emerald-500">
          <div class="font-jua text-base text-emerald-950">🌱 유년반</div>
          <p class="text-[11px] text-slate-600 mt-0.5">초등 1~3학년 · 표준 모험 & 말씀 퀴즈</p>
        </button>
        <button type="button" onclick="selectClassAndShowMap('senior')" class="mc-btn p-3 rounded-2xl bg-sky-100 hover:bg-sky-200 border-sky-500">
          <div class="font-jua text-base text-sky-950">🍎 소년반</div>
          <p class="text-[11px] text-slate-600 mt-0.5">초등 4~6학년 · 화살표 숨김 & 심화 코스</p>
        </button>
        <button type="button" onclick="selectClassAndShowMap('timeattack')" class="mc-btn p-3 rounded-2xl bg-rose-100 hover:bg-rose-200 border-rose-500">
          <div class="font-jua text-base text-rose-950">⚡ 타임어택</div>
          <p class="text-[11px] text-slate-600 mt-0.5">스피드 도전 · 시간 연장 아이템 모드</p>
        </button>
      </div>

      <button type="button" onclick="openScreen('screen-opening')" class="mc-btn px-4 py-1.5 rounded-xl bg-slate-200 text-slate-700 font-jua text-xs">
        ◀ 이름 다시 입력하기
      </button>
    </div>
  </div>

  <!-- =================================================================== -->
  <!-- 화면 3: 실제 성경 지형 기반 대륙 월드맵 & 에피소드 1~4 이동경로 -->
  <!-- =================================================================== -->
  <div id="screen-map" class="hidden fixed inset-0 z-30 items-center justify-center p-2 sm:p-4 bg-slate-950/75 backdrop-blur-sm">
    <div class="mc-card w-full max-w-5xl rounded-3xl p-2.5 sm:p-4 flex flex-col">
      <!-- 상단 헤더 바 -->
      <div class="flex items-center justify-between gap-2 mb-2 px-1">
        <div class="flex items-center gap-2">
          <span class="text-lg sm:text-2xl">🗺️</span>
          <div>
            <h2 class="font-jua text-base sm:text-xl text-amber-950 leading-tight">성경 탐험 월드맵</h2>
            <p class="text-[10px] sm:text-xs text-slate-600">탐험 경로(1→2→3→4)를 따라 원하는 에피소드를 선택하세요!</p>
          </div>
        </div>
        <div class="flex items-center gap-1.5">
          <span id="map-selected-badge" class="px-2.5 py-1 rounded-full bg-amber-200 border border-amber-500 font-jua text-amber-950 text-[11px] sm:text-xs">🌱 유년반</span>
          <button type="button" onclick="openScreen('screen-class')" class="mc-btn px-2.5 py-1 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-800 font-jua text-[11px] sm:text-xs">
            ◀ 반 변경
          </button>
        </div>
      </div>

      <!-- 실제 고대 지형도 스타일 월드맵 영역 -->
      <div class="landscape-map-wrap relative w-full h-[72dvh] max-h-[530px] min-h-[260px] rounded-2xl overflow-hidden border-4 border-amber-900 shadow-inner bg-[#e6cfa3]">
        <svg viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid slice" class="w-full h-full">
          <defs>
            <!-- 대륙 양피지 & 지형 그라데이션 -->
            <linearGradient id="parchmentLand" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#f3e3be" />
              <stop offset="45%" stop-color="#e7cf9e" />
              <stop offset="100%" stop-color="#d7b575" />
            </linearGradient>
            <linearGradient id="medSeaGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#0369a1" />
              <stop offset="65%" stop-color="#0284c7" />
              <stop offset="100%" stop-color="#38bdf8" />
            </linearGradient>
            <radialGradient id="fertileGreen" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#86efac" stop-opacity="0.72" />
              <stop offset="70%" stop-color="#4ade80" stop-opacity="0.35" />
              <stop offset="100%" stop-color="#4ade80" stop-opacity="0" />
            </radialGradient>
            <radialGradient id="desertGold" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.52" />
              <stop offset="70%" stop-color="#d97706" stop-opacity="0.24" />
              <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
            </radialGradient>
            <marker id="routeArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
              <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
            </marker>
          </defs>

          <!-- 1) 전체 대륙 베이스 (하나로 연결된 고대 근동 대륙 지형) -->
          <rect width="1000" height="560" fill="url(#parchmentLand)" />

          <!-- 지역별 생태 기후대 음영 (비옥한 초승달 지대, 가나안 구릉지, 시내산 사막) -->
          <ellipse cx="220" cy="135" rx="210" ry="115" fill="url(#fertileGreen)" />
          <ellipse cx="755" cy="185" rx="210" ry="135" fill="url(#fertileGreen)" />
          <ellipse cx="640" cy="400" rx="175" ry="125" fill="url(#fertileGreen)" />
          <ellipse cx="290" cy="445" rx="230" ry="135" fill="url(#desertGold)" />

          <!-- 2) 서쪽 대해(지중해) 해안선 & 남쪽 홍해 바닷물 지형 -->
          <!-- 지중해 (좌측 중부 해안만) -->
          <path d="M 0 215 Q 115 210 165 245 Q 205 280 175 330 Q 130 355 0 350 Z" fill="url(#medSeaGrad)" stroke="#b45309" stroke-width="3.5" />
          <path d="M 8 223 Q 110 218 156 250 Q 192 280 165 322 Q 124 344 8 342" fill="none" stroke="#bae6fd" stroke-width="2" opacity="0.65" />

          <!-- 남쪽 홍해만 (이집트와 시내 광야 사이로 뻗은 실제 만 형태) -->
          <path d="M 215 560 L 245 385 Q 262 365 282 385 L 315 505 L 355 415 Q 370 398 385 418 L 410 560 Z" fill="url(#medSeaGrad)" stroke="#b45309" stroke-width="3.5" />

          <!-- 3) 주요 강줄기와 내륙 호수 (나일강, 갈릴리 호수, 요단강, 사해, 유프라테스강) -->
          <!-- 나일강 & 삼각주 -->
          <path d="M 95 560 Q 115 475 108 410 L 82 350 M 108 410 L 112 348 M 108 410 L 138 352" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round" />
          <!-- 북부 아라랏 강줄기 -->
          <path d="M 65 95 Q 195 145 355 110 Q 475 80 560 130" fill="none" stroke="#0284c7" stroke-width="4" stroke-dasharray="1 0" opacity="0.75" />
          <!-- 갈릴리 호수 → 요단강 → 사해 (동부 내륙 수계) -->
          <path d="M 780 95 L 775 165 Q 765 265 735 335 Q 690 400 635 435" fill="none" stroke="#0284c7" stroke-width="5.5" stroke-linecap="round" />
          <!-- 갈릴리 호수 (EP 4) -->
